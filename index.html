<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C45C26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Quill" />
  <title>Quill</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app">
    <section id="screen-notes" class="screen active">
      <header class="topbar"><h1>Quill</h1></header>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="search" id="search-notes" type="search" placeholder="Search notes" enterkeyhint="search" />
      </div>
      <div class="list" id="notes-list"></div>
    </section>

    <section id="screen-archive" class="screen">
      <header class="topbar"><h1>Archive</h1></header>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="search" id="search-archive" type="search" placeholder="Search archive" />
      </div>
      <div class="list" id="archive-list"></div>
    </section>

    <section id="screen-settings" class="screen">
      <header class="topbar"><h1>Settings</h1></header>
      <div class="settings">
        <div class="group">
          <label class="row">Theme
            <select id="theme-select">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="row">Sort notes
            <select id="sort-select">
              <option value="updated">Last edited</option>
              <option value="created">Date created</option>
              <option value="title">Title</option>
            </select>
          </label>
        </div>
        <div class="group">
          <div class="row"><span>Export backup</span><button id="btn-export" type="button">Download</button></div>
          <div class="row"><span>Import backup</span><button id="btn-import" type="button">Choose file</button></div>
          <div class="row"><span>Clear all notes</span><button id="btn-clear" type="button">Clear</button></div>
        </div>
        <p class="hint" id="count-line"></p>
        <p class="hint">Quill stores notes only on this device. Add it to your home screen for an app-like experience.</p>
      </div>
    </section>

    <section id="screen-editor" class="screen">
      <div class="editor-bar">
        <button class="ghost" id="btn-back" type="button">Back</button>
        <div class="editor-actions">
          <button class="icon-btn" id="btn-pin" type="button" title="Pin" aria-label="Pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5M8 3l8 4-2 6H10L8 3z"/></svg>
          </button>
          <button class="icon-btn" id="btn-archive" type="button" title="Archive" aria-label="Archive">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M9 14h6"/></svg>
          </button>
          <button class="icon-btn" id="btn-delete" type="button" title="Delete" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
      </div>
      <input class="title-input" id="note-title" placeholder="Title" maxlength="120" />
      <div class="color-row">
        <button class="swatch parchment on" data-color="parchment" type="button" aria-label="Parchment"></button>
        <button class="swatch sienna" data-color="sienna" type="button" aria-label="Sienna"></button>
        <button class="swatch sage" data-color="sage" type="button" aria-label="Sage"></button>
        <button class="swatch ink" data-color="ink" type="button" aria-label="Ink"></button>
        <button class="swatch gold" data-color="gold" type="button" aria-label="Gold"></button>
        <button class="swatch rose" data-color="rose" type="button" aria-label="Rose"></button>
      </div>
      <textarea class="body-input" id="note-body" placeholder="Write something worth keeping…"></textarea>
    </section>

    <button class="fab" id="fab" type="button" aria-label="New note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabs">
      <button class="tab active" data-view="notes" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h9l5 5v11H6z"/><path d="M15 4v5h5"/></svg>
        Notes
      </button>
      <button class="tab" data-view="archive" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
        Archive
      </button>
      <button class="tab" data-view="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H8a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V8c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
    </nav>
    <div class="toast" id="toast" role="status"></div>
    <input id="file-import" type="file" accept="application/json" hidden />
  </div>
  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
