name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "css/**"
      - "js/**"
      - "icons/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle web assets
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          cp index.html manifest.json sw.js android-app/app/src/main/assets/www/
          cp -R css js icons android-app/app/src/main/assets/www/

      - name: Build Android test APK
        run: gradle -p android-app :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Folio-Notes-v1.0.0-test.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-notes-apk
          path: Folio-Notes-v1.0.0-test.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-test"
          TITLE="Folio Notes v1.0.0 test build"
          NOTES="Installable Android test build for device testing. This APK is debug-signed; a release-signed AAB/APK will be used for store distribution."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Folio-Notes-v1.0.0-test.apk --clobber
          else
            gh release create "$TAG" Folio-Notes-v1.0.0-test.apk               --title "$TITLE"               --notes "$NOTES"               --prerelease               --target "$GITHUB_SHA"
          fi
