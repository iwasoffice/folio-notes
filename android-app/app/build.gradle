plugins {
    id 'com.android.application'
}

android {
    namespace 'com.folio.notes'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('../folio-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.folio.notes"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
}
